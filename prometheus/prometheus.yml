global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Kafka Connect exposes basic metrics you can scrape once JMX exporter
  # is added later. Left here as a placeholder target for now.
  - job_name: "kafka-connect"
    static_configs:
      - targets: ["kafka-connect:8083"]
